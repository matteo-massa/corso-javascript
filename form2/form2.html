<div class="form-container">
  <form id="form-recensione" class="war-room-form">
    <h2 class="form-titolo">Nuova Recensione Competitor</h2>

    <div class="form-group">
      <label for="tipo-banca">Tipologia Istituto</label>
      <select id="tipo-banca" name="tipoBanca" required>
        <option value="" disabled selected>Seleziona banca...</option>
        <option value="tradizionale">Banca Tradizionale</option>
        <option value="digitale">Banca Digitale</option>
      </select>
    </div>

    <div class="form-group">
      <label for="testo-recensione">Testo della Recensione</label>
      <textarea id="testo-recensione" name="testoRecensione" rows="5" placeholder="Incolla qui il testo della recensione analizzata..." required></textarea>
    </div>

    <div class="form-group">
      <label for="sentiment">Analisi Sentiment</label>
      <select id="sentiment" name="sentiment" required>
        <option value="" disabled selected>Classifica il tono...</option>
        <option value="positivo">Positivo</option>
        <option value="negativo">Negativo</option>
      </select>
      <small class="form-nota">Valore 'Neutrale' disabilitato per policy di pulizia dati.</small>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="bug-tecnico" name="bugTecnico">
      <label for="bug-tecnico">Evidenzia possibile Bug Tecnico</label>
    </div>

    <button type="submit" class="btn-submit">Salva a Sistema</button>
  </form>
</div>
