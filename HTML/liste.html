<!DOCTYPE html>
<html lang="it">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Liste</title>
    </head>

    <body>
        <h1>Liste</h1>
        <!-- liste non ordinate (tag ul -> unordered list) -->
        <ul>
            <!-- singolo elemento tag li -> list item -->
            <li>Elemento 1
                <ul>
                    <li>1.1</li>
                    <li>1.2</li>
                    <li>1.3</li>
                </ul>
            </li>
            <li>Elemento 2
                <ul>
                    <li>2.1</li>
                    <li>2.2</li>
                    <li>2.3</li>
                </ul>
            </li>
            <li>Elemento 3</li>
        </ul>


        <!-- liste ordinate (tag ol -> ordered list)-->
        <ol type="a">
            <!-- attr reversed per ordinare in senso decrescente -->
            <!-- singolo elemento tag li -> list item -->
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
        </ol>

    </body>

</html>
